version: '3.8'

services:
  db:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: game
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-scripts:/docker-entrypoint-initdb.d  # Подключаем скрипты инициализации

  app:
    build:
      context: .  # Папка с Dockerfile приложения
    container_name: tomcat_app
    restart: always
    depends_on:
      - db
    environment:
      JAVA_OPTS: "-Xms256m -Xmx400m -XX:+UseContainerSupport"
      DATABASE_URL: "jdbc:postgresql://db:5432/game"
      DATABASE_USER: "postgres"
      DATABASE_PASSWORD: "postgres"
    ports:
      - "8080:8080"

volumes:
  postgres_data:

